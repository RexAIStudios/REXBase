<style>

<body>

<div id="loginScreen">
    <div class="loginBox">
        <h1>Private Storage</h1>

        <input
            id="username"
            type="text"
            placeholder="Username"
            autocomplete="username"
        >

        <input
            id="password"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button onclick="login()">
            Sign In
        </button>

        <div id="loginError" class="error"></div>
    </div>
</div>

<div id="app" class="hidden">

    <aside class="sidebar">

        <h2>Storage</h2>

        <button onclick="goRoot()">
            Root
        </button>

        <button onclick="goUp()">
            Parent Folder
        </button>

        <button onclick="createFolder()">
            New Folder
        </button>

        <button onclick="document.getElementById('upload').click()">
            Upload Files
        </button>

        <input
            id="upload"
            type="file"
            multiple
            hidden
            onchange="uploadFiles()"
        >

        <button onclick="logout()">
            Sign Out
        </button>

        <button class="danger" onclick="openDeleteStorage()">
            Delete Entire Storage
        </button>

    </aside>

    <main class="main">

        <div class="topbar">
            <div id="currentPath">
                /
            </div>
        </div>

        <div class="toolbar">
            <button onclick="refresh()">
                Refresh
            </button>
        </div>

        <div id="fileList" class="fileList"></div>

    </main>

</div>

<div id="editor" class="hidden">

    <div class="editorHeader">

        <span id="editorName">
            File
        </span>

        <button onclick="closeEditor()">
            X
        </button>

    </div>

    <textarea id="editorText"></textarea>

    <div class="editorButtons">

        <button class="save" onclick="saveEditor()">
            Save
        </button>

        <button class="close" onclick="closeEditor()">
            Cancel
        </button>

    </div>

</div>

<div id="deleteModal" class="modal hidden">

    <div class="modalBox">

        <h2>Delete Entire Storage</h2>

        <p>
            This permanently deletes everything inside the configured
            storage folder.
        </p>

        <input
            id="deletePassword"
            type="password"
            placeholder="Deletion password"
        >

        <div id="deleteError" class="error"></div>

        <div class="modalButtons">

            <button onclick="closeDeleteStorage()">
                Cancel
            </button>

            <button
                class="deleteConfirm"
                onclick="deleteStorage()"
            >
                Permanently Delete
            </button>

        </div>

    </div>

</div>

<script>

const API = "https://raidenscomputer.tail581abf.ts.net";

let token = localStorage.getItem("privateStorageToken");

let currentPath = "";

let editingPath = "";

let loggingOut = false;


async function api(path, options = {}) {

    options.headers = {
        ...(options.headers || {})
    };

    if (token) {
        options.headers["Authorization"] =
            `Bearer ${token}`;
    }

    const response = await fetch(
        API + path,
        options
    );

    if (response.status === 401) {

        if (!loggingOut) {
            forceLogin();
        }

        throw new Error("Authentication expired");

    }

    return response;

}


function forceLogin() {

    loggingOut = true;

    token = null;

    localStorage.removeItem(
        "privateStorageToken"
    );

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    loggingOut = false;

}


async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("loginError");

    error.textContent = "";

    try {

        const response = await fetch(
            API + "/api/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.error || "Login failed"
            );

        }

        token = data.token;

        localStorage.setItem(
            "privateStorageToken",
            token
        );

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("app")
            .classList.remove("hidden");

        currentPath = "";

        await refresh();

    } catch (error) {

        document
            .getElementById("loginError")
            .textContent =
            error.message;

    }

}


async function logout() {

    if (loggingOut) {
        return;
    }

    loggingOut = true;

    const oldToken = token;

    token = null;

    localStorage.removeItem(
        "privateStorageToken"
    );

    try {

        if (oldToken) {

            await fetch(
                API + "/api/logout",
                {
                    method: "POST",

                    headers: {
                        "Authorization":
                            `Bearer ${oldToken}`
                    }
                }
            );

        }

    } catch (_) {}

    document
        .getElementById("app")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.remove("hidden");

    loggingOut = false;

}


async function refresh() {

    const response =
        await api(
            "/api/files?path=" +
            encodeURIComponent(currentPath)
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(data.error);

        return;

    }

    document
        .getElementById("currentPath")
        .textContent =
        "/" + currentPath;

    const list =
        document.getElementById("fileList");

    list.innerHTML = "";

    if (currentPath) {

        const parent =
            document.createElement("div");

        parent.className = "file";

        parent.innerHTML = `
            <div class="fileIcon">↩</div>
            <div class="fileName clickable">..</div>
            <div></div>
            <div></div>
            <div></div>
        `;

        parent.onclick = goUp;

        list.appendChild(parent);
    }

    for (const item of data.items) {

        const row =
            document.createElement("div");

        row.className = "file";

        const icon =
            item.type === "folder"
                ? "📁"
                : "📄";

        const size =
            item.type === "file"
                ? formatSize(item.size)
                : "";

        row.innerHTML = `
            <div class="fileIcon">${icon}</div>

            <div class="fileName clickable">
                ${escapeHtml(item.name)}
            </div>

            <div class="fileSize">
                ${size}
            </div>

            <div class="fileSize">
                ${new Date(
                    item.modified * 1000
                ).toLocaleString()}
            </div>

            <div class="fileActions">
                <button>Delete</button>
            </div>
        `;

        const name =
            row.querySelector(".fileName");

        name.onclick = () => {

            if (item.type === "folder") {

                currentPath = item.path;

                refresh();

            } else {

                openFile(item);

            }

        };

        const deleteButton =
            row.querySelector(".fileActions button");

        deleteButton.onclick = event => {

            event.stopPropagation();

            deleteItem(item.path);

        };

        list.appendChild(row);

    }

}


function goRoot() {

    currentPath = "";

    refresh();

}


function goUp() {

    if (!currentPath) {
        return;
    }

    const parts =
        currentPath.split("/");

    parts.pop();

    currentPath =
        parts.join("/");

    refresh();

}


async function createFolder() {

    const name =
        prompt("Folder name:");

    if (!name) {
        return;
    }

    const response =
        await api(
            "/api/folder",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    path: currentPath,
                    name
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(data.error);

        return;

    }

    refresh();

}


async function uploadFiles() {

    const input =
        document.getElementById("upload");

    for (const file of input.files) {

        const form =
            new FormData();

        form.append(
            "file",
            file
        );

        form.append(
            "path",
            currentPath
        );

        const response =
            await api(
                "/api/upload",
                {
                    method: "POST",
                    body: form
                }
            );

        if (!response.ok) {

            const data =
                await response.json();

            alert(data.error);

            break;

        }

    }

    input.value = "";

    refresh();

}


async function openFile(item) {

    const extension =
        item.name
            .split(".")
            .pop()
            .toLowerCase();

    const editable = [
        "txt",
        "py",
        "js",
        "html",
        "css",
        "json",
        "xml",
        "lua",
        "cs",
        "cpp",
        "h",
        "hpp",
        "java",
        "md",
        "yaml",
        "yml",
        "ini",
        "cfg",
        "bat",
        "ps1",
        "sh"
    ];

    if (!editable.includes(extension)) {

        await openProtectedFile(item.path);

        return;

    }

    const response =
        await api(
            "/api/file?path=" +
            encodeURIComponent(item.path)
        );

    if (!response.ok) {

        alert("Unable to open file");

        return;

    }

    const content =
        await response.text();

    editingPath = item.path;

    document
        .getElementById("editorName")
        .textContent = item.name;

    document
        .getElementById("editorText")
        .value = content;

    document
        .getElementById("editor")
        .classList.remove("hidden");

}


async function openProtectedFile(path) {

    try {

        const response =
            await api(
                "/api/file?path=" +
                encodeURIComponent(path)
            );

        if (!response.ok) {

            const data =
                await response.json().catch(() => ({}));

            alert(
                data.error ||
                "Unable to open file"
            );

            return;

        }

        const blob =
            await response.blob();

        const url =
            URL.createObjectURL(blob);

        window.open(
            url,
            "_blank",
            "noopener,noreferrer"
        );

        setTimeout(() => {
            URL.revokeObjectURL(url);
        }, 60000);

    } catch (error) {

        if (error.message !== "Authentication expired") {

            alert(
                "Unable to open file: " +
                error.message
            );

        }

    }

}


async function saveEditor() {

    const content =
        document
            .getElementById("editorText")
            .value;

    const response =
        await api(
            "/api/save",
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    path: editingPath,
                    content
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(data.error);

        return;

    }

    closeEditor();

}


function closeEditor() {

    editingPath = "";

    document
        .getElementById("editor")
        .classList.add("hidden");

}


async function deleteItem(path) {

    if (!confirm("Delete this item?")) {
        return;
    }

    const response =
        await api(
            "/api/delete",
            {
                method: "DELETE",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    path
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        alert(data.error);

        return;

    }

    refresh();

}


function openDeleteStorage() {

    document
        .getElementById("deletePassword")
        .value = "";

    document
        .getElementById("deleteError")
        .textContent = "";

    document
        .getElementById("deleteModal")
        .classList.remove("hidden");

}


function closeDeleteStorage() {

    document
        .getElementById("deleteModal")
        .classList.add("hidden");

}


async function deleteStorage() {

    const password =
        document
            .getElementById("deletePassword")
            .value;

    const response =
        await api(
            "/api/delete-storage",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    password
                })
            }
        );

    const data =
        await response.json();

    if (!response.ok) {

        document
            .getElementById("deleteError")
            .textContent =
            data.error ||
            "Deletion failed";

        return;

    }

    closeDeleteStorage();

    currentPath = "";

    await refresh();

    alert(
        "The entire storage folder was deleted and recreated."
    );

}


function formatSize(bytes) {

    if (bytes < 1024)
        return bytes + " B";

    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";

    if (bytes < 1024 * 1024 * 1024)
        return (
            bytes /
            1024 /
            1024
        ).toFixed(1) + " MB";

    return (
        bytes /
        1024 /
        1024 /
        1024
    ).toFixed(2) + " GB";

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


if (token) {

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    refresh()
        .catch(() => {});

}

</script>

</body>
</html>
